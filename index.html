<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Youtube Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background-color:#121212;
    color:#eaeaea;
}
h1,h2,h3{color:#fff;}
p{color:#b3b3b3;}
.box{
    border:2px solid white;
    border-radius:15px;
}
.carousel{
    width : 70%;
    margin:auto;
    margin-top:10px;
}
.carousel-item img{
    height : 350px;
    width: 100%;
    object-fit : contain;
    border-radius : 15px;
}
.card-body{
    text-align : center;
    display : flex;
    flex-direction : column;
    justify-content: space-around;
}
.card img{
    border-radius : 8px;
}
.card{
    height : 100%;
    transition : 0.4s;
    box-shadow:0px 0px 15px rgba(255,255,255,0.1);
}
.card:hover{
    transform:translateY(-10px);
}
.card .btn{
    transition: 0.3s;
}
.btn:hover{
    transform:scale(1.05);
}
.nav-link{
    transition:0.3s;
}
.nav-link:hover{
    color:red !important;
}
</style>

</head>
<body>

<div class="container">

    <nav class="navbar navbar-expand-lg bg-dark">

    <div class="container">

        <a class="navbar-brand text-light fw-bold" href="#">
            Chai aur Code 
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarContent">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link text-light" href="#">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light" href="#">
                        Courses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light" href="#">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light" href="#">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

    <!-- Carousel section -->
    <div class="box p-5 mt-3">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="image/Screenshot 2026-05-27 150434.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="image/Screenshot 2026-05-27 150441.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="image/Screenshot 2026-05-27 150447.png" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
    </div>

    <!-- Cards section -->
    <div class="mt-4">
        <div class="row mt-5">

    <div class="row mt-5">

    <div class="col-md-4">
        <div class="card bg-dark text-light">

            <img src="image/Screenshot 2026-05-27 152501.png" class="card-img-top" alt="React">

            <div class="card-body text-center">

                <h3 class="card-title">
                    React Course
                </h3>

                <p class="card-text">
                    Learn React in 10 days.
                </p>

                <button class="btn btn-danger px-5">
                    Watch Now
                </button>

            </div>

        </div>
    </div>


    <div class="col-md-4">
        <div class="card bg-dark text-light">

            <img src="image/Screenshot 2026-05-27 153616.png" class="card-img-top" alt="roadmap image">

            <div class="card-body text-center">

                <h3 class="card-title">
                    Full Stack Roadmap
                </h3>

                <p class="card-text">
                    Be a Full Stack Developer
                </p>

                <button class="btn btn-danger px-5">
                    Watch Now
                </button>

            </div>

        </div>
    </div>


    <div class="col-md-4">
        <div class="card bg-dark text-light">

            <img src="image/Screenshot 2026-05-27 153624.png" class="card-img-top" alt="Backend">

            <div class="card-body text-center">

                <h3 class="card-title">
                    Future of programming
                </h3>

                <p class="card-text">
                    This is how the future looks like.
                </p>

                <button class="btn btn-danger px-5">
                    Watch Now
                </button>

            </div>

        </div>
    </div>

</div>

    <footer class="box mt-5 p-3 text-center">

    <p class="mb-0">
        © 2026 Harsh Dutt Sharma | All Rights Reserved
    </p>

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
